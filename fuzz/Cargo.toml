[package]
name = "tylax-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
typst-syntax = "0.14"

[dependencies.tylax]
path = ".."
default-features = false

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "l2t_math"
path = "fuzz_targets/l2t_math.rs"
test = false
doc = false
bench = false

[[bin]]
name = "l2t_document"
path = "fuzz_targets/l2t_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "t2l_math"
path = "fuzz_targets/t2l_math.rs"
test = false
doc = false
bench = false

[[bin]]
name = "t2l_document"
path = "fuzz_targets/t2l_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "l2t_math_parses"
path = "fuzz_targets/l2t_math_parses.rs"
test = false
doc = false
bench = false
